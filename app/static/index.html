<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wavebreak</title>
<style>
  :root { --bg:#f4f7f9; --fg:#1b2a33; --muted:#5b6b75; --accent:#2a7f9e; --card:#fff; --crisis:#fdecea; --border:#d5dee3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10181d; --fg:#e6eef2; --muted:#93a4ae; --accent:#58b4d1; --card:#18242b; --crisis:#3a1f1f; --border:#2a3a43; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); display:flex; flex-direction:column; height:100dvh; }
  header { padding:12px 16px; font-weight:600; border-bottom:1px solid var(--border); }
  #disclaimer { display:flex; gap:12px; align-items:flex-start; padding:10px 16px; background:var(--card); border-bottom:1px solid var(--border); color:var(--muted); font-size:14px; }
  #disclaimer button { margin-left:auto; background:none; border:0; color:var(--fg); font-size:18px; cursor:pointer; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:min(85%, 560px); padding:10px 14px; border-radius:14px; white-space:pre-wrap; background:var(--card); border:1px solid var(--border); }
  .me { align-self:flex-end; background:var(--accent); color:#fff; border-color:var(--accent); }
  .crisis { background:var(--crisis); }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--border); }
  input { flex:1; padding:12px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--fg); font:inherit; }
  form button { padding:0 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; }
</style>
</head>
<body>
<header>Wavebreak</header>
<div id="disclaimer"><span id="disclaimer-text"></span><button id="close" aria-label="Close notice">&times;</button></div>
<main id="log" aria-live="polite"></main>
<form id="form">
  <input id="input" autocomplete="off" maxlength="4000" placeholder="What's going on?" aria-label="Message">
  <button id="send">Send</button>
</form>
<script>
const log = document.getElementById("log"), input = document.getElementById("input"), send = document.getElementById("send");
const add = (text, cls) => { const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; };
const history = [];  // this tab only; sent with each message so the Companion has context
const WORD_DELAY_MS = 35;
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
// Reveals text in `pending` one word at a time, while more may still be arriving.
function makeTyper(bubble) {
  let pending = "", shown = "", done = false;
  const finished = (async () => {
    while (!done || pending) {
      const m = pending.match(/^\s*\S+\s*/);
      if (!m) { await sleep(20); continue; }
      pending = pending.slice(m[0].length);
      shown += m[0]; bubble.textContent = shown; log.scrollTop = log.scrollHeight;
      await sleep(WORD_DELAY_MS);
    }
  })();
  return { push: (t) => { pending += t; }, end: () => { done = true; return finished; }, text: () => shown + pending };
}
fetch("/chat/start").then(r => r.json()).then(d => document.getElementById("disclaimer-text").textContent = d.disclaimer);
document.getElementById("close").onclick = () => document.getElementById("disclaimer").remove();
document.getElementById("form").onsubmit = async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  add(message, "me"); input.value = ""; send.disabled = true;
  const bubble = add("", "bot"), typer = makeTyper(bubble);
  let reply = "", failed = false;
  try {
    const r = await fetch("/chat/stream", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message, history }) });
    if (!r.ok) throw new Error();
    const reader = r.body.getReader(), decoder = new TextDecoder();
    let buf = "";
    const handle = (line) => {
      if (!line.trim()) return;
      const ev = JSON.parse(line);
      if (ev.type === "delta") { reply += ev.text; typer.push(ev.text); }
      else if (ev.type === "crisis") { reply = ev.text; bubble.classList.add("crisis"); typer.push(ev.text); }
      else if (ev.type === "error") failed = true;
    };
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split("\n"); buf = lines.pop();
      lines.forEach(handle);
    }
    handle(buf);
  } catch { failed = true; }
  if (failed && !reply) typer.push("The Companion is unavailable right now. Please try again in a moment.");
  await typer.end();
  if (reply) history.push({ role: "user", content: message }, { role: "assistant", content: reply });
  send.disabled = false; input.focus();
};
</script>
</body>
</html>
