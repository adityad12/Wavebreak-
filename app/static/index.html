<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wavebreak</title>
<style>
  :root { --bg:#f4f7f9; --fg:#1b2a33; --muted:#5b6b75; --accent:#2a7f9e; --card:#fff; --crisis:#fdecea; --border:#d5dee3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10181d; --fg:#e6eef2; --muted:#93a4ae; --accent:#58b4d1; --card:#18242b; --crisis:#3a1f1f; --border:#2a3a43; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); display:flex; flex-direction:column; height:100dvh; }
  header { padding:12px 16px; font-weight:600; border-bottom:1px solid var(--border); }
  #disclaimer { display:flex; gap:12px; align-items:flex-start; padding:10px 16px; background:var(--card); border-bottom:1px solid var(--border); color:var(--muted); font-size:14px; }
  #disclaimer button { margin-left:auto; background:none; border:0; color:var(--fg); font-size:18px; cursor:pointer; }
  #memory { padding:8px 16px; font-size:14px; color:var(--muted); border-bottom:1px solid var(--border); }
  #memory pre { white-space:pre-wrap; margin:8px 0 0; font:inherit; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:min(85%, 560px); padding:10px 14px; border-radius:14px; white-space:pre-wrap; background:var(--card); border:1px solid var(--border); }
  .me { align-self:flex-end; background:var(--accent); color:#fff; border-color:var(--accent); }
  .crisis { background:var(--crisis); }
  .dots span { display:inline-block; width:7px; height:7px; margin:0 2px; border-radius:50%; background:var(--muted); animation:blink 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay:.2s; }
  .dots span:nth-child(3) { animation-delay:.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity:.25; } 40% { opacity:1; } }
  @media (prefers-reduced-motion: reduce) { .dots span { animation:none; } }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--border); }
  input { flex:1; padding:12px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--fg); font:inherit; }
  form button { padding:0 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; }
</style>
</head>
<body>
<header>Wavebreak</header>
<div id="disclaimer"><span id="disclaimer-text"></span><button id="close" aria-label="Close notice">&times;</button></div>
<details id="memory" hidden><summary>What I remember from earlier in this chat</summary><pre id="memory-text"></pre></details>
<main id="log" aria-live="polite"></main>
<form id="form">
  <input id="input" autocomplete="off" maxlength="4000" placeholder="What's going on?" aria-label="Message">
  <button id="send">Send</button>
</form>
<script>
const log = document.getElementById("log"), input = document.getElementById("input"), send = document.getElementById("send");
const add = (text, cls) => { const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; };
const history = [];  // this tab only; sent with each message so the Companion has context
let summary = "", facts = [], compacting = false;  // what we remember from messages already dropped
const SUMMARISE_WHEN = 16, KEEP_RECENT = 8;
const memoryBox = document.getElementById("memory"), memoryText = document.getElementById("memory-text");
function showMemory() {
  memoryBox.hidden = !summary && !facts.length;
  memoryText.textContent = [summary && "Summary: " + summary, ...facts.map(f => "- " + f)].filter(Boolean).join("\n");
}
// When the history gets long, fold the oldest messages into the summary and notes, then drop them.
async function maybeCompact() {
  if (compacting || history.length < SUMMARISE_WHEN) return;
  compacting = true;
  const n = history.length - KEEP_RECENT;  // history only grows at the end, so this prefix stays valid
  try {
    const r = await fetch("/chat/memory", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ summary, facts, messages: history.slice(0, n) }) });
    if (r.ok) { const d = await r.json(); summary = d.summary; facts = d.facts; history.splice(0, n); showMemory(); }
  } catch { /* keep the old state and try again after the next message */ }
  compacting = false;
}
const WORD_DELAY_MS = 35;
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
// Reveals text in `pending` one word at a time, while more may still be arriving.
// The bubble is only created when the first word is ready, so no empty box appears while waiting.
function makeTyper(createBubble) {
  let pending = "", shown = "", done = false, bubble = null, crisis = false;
  const finished = (async () => {
    while (!done || pending) {
      const m = pending.match(/^\s*\S+\s*/);
      if (!m) { await sleep(20); continue; }
      pending = pending.slice(m[0].length);
      shown += m[0];
      if (!bubble) { bubble = createBubble(); if (crisis) bubble.classList.add("crisis"); }
      bubble.textContent = shown; log.scrollTop = log.scrollHeight;
      await sleep(WORD_DELAY_MS);
    }
  })();
  return {
    push: (t) => { pending += t; },
    markCrisis: () => { crisis = true; if (bubble) bubble.classList.add("crisis"); },
    end: () => { done = true; return finished; },
  };
}
fetch("/chat/start").then(r => r.json()).then(d => document.getElementById("disclaimer-text").textContent = d.disclaimer);
document.getElementById("close").onclick = () => document.getElementById("disclaimer").remove();
document.getElementById("form").onsubmit = async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  add(message, "me"); input.value = ""; send.disabled = true;
  // Typing dots show while we wait; the reply bubble replaces them when the first word is ready.
  const dots = add("", "bot dots");
  dots.setAttribute("aria-label", "The Companion is typing");
  dots.innerHTML = "<span></span><span></span><span></span>";
  const typer = makeTyper(() => { dots.remove(); return add("", "bot"); });
  let reply = "", failed = false;
  try {
    const r = await fetch("/chat/stream", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message, history, summary, facts }) });
    if (!r.ok) throw new Error();
    const reader = r.body.getReader(), decoder = new TextDecoder();
    let buf = "";
    const handle = (line) => {
      if (!line.trim()) return;
      const ev = JSON.parse(line);
      if (ev.type === "delta") { reply += ev.text; typer.push(ev.text); }
      else if (ev.type === "crisis") { reply = ev.text; typer.markCrisis(); typer.push(ev.text); }
      else if (ev.type === "error") failed = true;
    };
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split("\n"); buf = lines.pop();
      lines.forEach(handle);
    }
    handle(buf);
  } catch { failed = true; }
  if (failed && !reply) typer.push("The Companion is unavailable right now. Please try again in a moment.");
  await typer.end();
  dots.remove();  // no-op if the reply already replaced them
  if (reply) { history.push({ role: "user", content: message }, { role: "assistant", content: reply }); maybeCompact(); }
  send.disabled = false; input.focus();
};
</script>
</body>
</html>
